<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Results Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9f9fb;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    .btn-container {
      text-align: center;
      margin-bottom: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background-color: #3498db;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2980b9;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #2c3e50;
      color: white;
    }
    /* Highlight failed student rows in red */
    .failed-row {
      background-color: #ffebee;
      color: #c62828;
      font-weight: bold;
    }
    .summary-box {
      margin-top: 25px;
      padding: 20px;
      background-color: white;
      border-left: 5px solid #3498db;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      line-height: 1.8;
      font-size: 16px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <h1>Student Marks & Results</h1>
  
  <div class="btn-container">
    <button onclick="generateResults()">Generate Results</button>
  </div>

  <!-- Results Section (Hidden until button click) -->
  <div id="outputSection" class="hidden">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Total (out of 300)</th>
          <th>Percentage</th>
          <th>Grade</th>
          <th>Result</th>
        </tr>
      </thead>
      <tbody id="resultsBody">
        <!-- Rows will be injected here -->
      </tbody>
    </table>

    <div class="summary-box" id="summarySection">
      <!-- Summary stats will be injected here -->
    </div>
  </div>

  <script>
    // 1. Store marks in an array of objects
    const students = [
      { name: "Aarav Sharma", maths: 92, science: 88, english: 95 },
      { name: "Priya Patel", maths: 78, science: 82, english: 74 },
      { name: "Rohan Verma", maths: 32, science: 65, english: 70 }, // Fails due to Maths < 35
      { name: "Sneha Gupta", maths: 64, science: 58, english: 61 },
      { name: "Vikram Singh", maths: 48, science: 45, english: 52 }
    ];

    // 2. Function to calculate grade based on percentage
    function getGrade(percentage) {
      if (percentage >= 90) return "A+";
      if (percentage >= 75) return "A";
      if (percentage >= 60) return "B";
      if (percentage >= 50) return "C";
      return "F"; // Below 50
    }

    // 3. Main function triggered on button click
    function generateResults() {
      const tbody = document.getElementById("resultsBody");
      const summarySection = document.getElementById("summarySection");
      const outputSection = document.getElementById("outputSection");

      // Clear previous table rows if clicked multiple times
      tbody.innerHTML = "";

      let totalClassPercentage = 0;
      let passedCount = 0;
      let topper = { name: "", percentage: -1 };

      students.forEach(student => {
        // Calculate total and percentage
        const total = student.maths + student.science + student.english;
        const percentage = (total / 300) * 100;
        const formattedPercentage = percentage.toFixed(2);
        const grade = getGrade(percentage);

        // Pass condition: every subject mark must be 35 or above
        const isPassed = student.maths >= 35 && student.science >= 35 && student.english >= 35;
        const status = isPassed ? "Pass" : "Fail";

        // Update class statistics
        totalClassPercentage += percentage;
        if (isPassed) passedCount++;

        // Check for class topper
        if (percentage > topper.percentage) {
          topper = { name: student.name, percentage: formattedPercentage };
        }

        // Create table row
        const row = document.createElement("tr");
        if (!isPassed) {
          row.classList.add("failed-row"); // Highlight failed student in red
        }

        row.innerHTML = `
          <td>${student.name}</td>
          <td>${total}</td>
          <td>${formattedPercentage}%</td>
          <td>${grade}</td>
          <td>${status}</td>
        `;

        tbody.appendChild(row);
      });

      // Calculate class average
      const classAverage = (totalClassPercentage / students.length).toFixed(2);

      // Display summary below the table
      summarySection.innerHTML = `
        <strong>🏆 Class Topper:</strong> ${topper.name} (${topper.percentage}%)<br>
        <strong>📊 Class Average:</strong> ${classAverage}%<br>
        <strong>✅ Students Passed:</strong> ${passedCount} out of ${students.length}
      `;

      // Reveal the table and summary
      outputSection.classList.remove("hidden");
    }
  </script>

</body>
</html>
